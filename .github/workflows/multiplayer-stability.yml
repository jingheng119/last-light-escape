name: Multiplayer stability tests

on:
  push:
    branches:
      - feature/persistent-match-results
    paths:
      - 'multiplayer/**'
      - '.github/workflows/multiplayer-stability.yml'
  pull_request:
    paths:
      - 'multiplayer/**'
      - '.github/workflows/multiplayer-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiplayer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: multiplayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install multiplayer dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run multiplayer regression suite
        run: npm test
