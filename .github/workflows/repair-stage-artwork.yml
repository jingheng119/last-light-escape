name: Repair uploaded stage artwork
on:
  push:
    branches: [feature/persistent-match-results]
    paths:
      - .github/workflows/repair-stage-artwork.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the single missing base64 character in uploaded image
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib
          p=pathlib.Path('multiplayer/assets/stage-artwork.webp')
          bad=p.read_bytes()
          target='42a388e6c7b5a15b5cf7a83c31ab2ac438dd822d'
          def git_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          if git_sha(bad)==target:
              print('Asset already exact; nothing to repair.')
          else:
              assert len(bad)==11717, f'Unexpected uploaded length {len(bad)}'
              chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              s=base64.b64encode(bad).decode().rstrip('=')
              assert len(s)==15623
              found=None
              for pos in range(len(s)+1):
                  before,after=s[:pos],s[pos:]
                  for char in chars:
                      candidate=base64.b64decode(before+char+after)
                      if git_sha(candidate)==target:
                          found=candidate
                          print(f'Restored one dropped character at position {pos}')
                          break
                  if found is not None:break
              if found is None:
                  raise SystemExit('No single-character correction matched; leave original unchanged')
              p.write_bytes(found)
              print('Exact asset checksum restored:',git_sha(p.read_bytes()))
          PY
      - name: Commit corrected artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiplayer/assets/stage-artwork.webp
          if ! git diff --cached --quiet; then
            git commit -m "fix(assets): restore verified three-stage background image"
            git push origin HEAD:feature/persistent-match-results
          fi
