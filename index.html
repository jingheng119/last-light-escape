<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Last Light: The Hollow Ward — connecting to the game server.">
  <title>Last Light — Connecting</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080d18;
      color: #edf2fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #17243a 0%, #0d1727 48%, #080d18 78%);
    }
    .loading-inner { width: min(90vw, 440px); }
    .spinner {
      width: 62px; height: 62px; margin: 0 auto 28px; border: 1px solid #5f779b;
      border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 38px #6d9be522;
    }
    .spinner::after {
      content: ""; width: 25px; height: 25px; border: 2px solid #b9cce8;
      border-right-color: transparent; border-radius: 50%; animation: spin 1.1s linear infinite;
    }
    h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: .15em; }
    .subtitle { margin: 0; color: #aab8ce; line-height: 1.7; }
    #status { margin-top: 28px; color: #d2dced; font-size: 13px; }
    .track { height: 3px; margin: 18px auto 0; max-width: 250px; overflow: hidden; background: #26364d; border-radius: 8px; }
    .track::after {
      content: ""; display: block; width: 35%; height: 100%; background: #a9c5ed;
      border-radius: inherit; animation: travel 1.7s ease-in-out infinite;
    }
    .note { margin: 22px 0 0; color: #8799b2; font-size: 12px; line-height: 1.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes travel { from { transform: translateX(-110%); } to { transform: translateX(390%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 3s !important; }
    }
  </style>
</head>
<body>
  <main class="loading-inner" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>LAST LIGHT</h1>
    <p class="subtitle">The Hollow Ward</p>
    <div id="status">Waking the game server…</div>
    <div class="track" aria-hidden="true"></div>
    <p class="note">The server may take a little longer to start when it has been idle. Please keep this page open.</p>
  </main>
  <script>
    const gameUrl = "https://last-light-online-trial.onrender.com/";
    const status = document.getElementById("status");
    let attempt = 0;

    async function wakeGame() {
      attempt += 1;
      try {
        await fetch(gameUrl, { mode: "no-cors", cache: "no-store" });
        status.textContent = "Connecting to the ward…";
        window.location.replace(gameUrl);
      } catch (error) {
        status.textContent = "The server is still waking up. Retrying…";
        window.setTimeout(wakeGame, Math.min(2000 + attempt * 1000, 8000));
      }
    }

    wakeGame();
  </script>
</body>
</html>
