<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Last Light — Loading</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8edf6; background: radial-gradient(ellipse at 50% 40%, #17243a 0%, #080d18 65%); }
    main { width: min(90vw, 460px); text-align: center; padding: 36px 24px; }
    .mark { width: 68px; height: 68px; margin: 0 auto 28px; border: 1px solid #5f779b; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 38px #6d9be522; }
    .mark::before { content: ""; width: 26px; height: 26px; border: 2px solid #b9cce8; border-right-color: transparent; border-radius: 50%; animation: spin 1.1s linear infinite; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 6vw, 2.3rem); letter-spacing: .14em; font-weight: 650; }
    p { margin: 0; color: #aab8ce; line-height: 1.6; }
    .status { margin-top: 28px; font-size: .92rem; color: #d2dced; }
    .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    .track { height: 3px; margin: 18px auto 0; max-width: 250px; overflow: hidden; background: #26364d; border-radius: 8px; }
    .track::after { content: ""; display: block; width: 35%; height: 100%; background: #a9c5ed; border-radius: inherit; animation: travel 1.7s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%,100% { content: "..."; } }
    @keyframes travel { from { transform: translateX(-110%); } to { transform: translateX(390%); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 3s !important; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>LAST LIGHT</h1>
    <p>The Hollow Ward</p>
    <div class="status" id="status" role="status" aria-live="polite">Waking the game server<span class="dots"></span></div>
    <div class="track" aria-hidden="true"></div>
    <p style="margin-top:22px;font-size:.8rem">This can take a little longer when the server has been idle.</p>
  </main>
  <script>
    // A no-cors request can wait for Render's cold start without exposing its response body.
    // Once it completes, navigate to the game. If the request errors, retry after a short pause.
    const gameUrl = "https://last-light-online-trial.onrender.com/";
    const status = document.getElementById("status");
    let attempt = 0;
    async function wakeGame() {
      attempt += 1;
      try {
        await fetch(gameUrl, { mode: "no-cors", cache: "no-store" });
        status.textContent = "Game is ready — entering";
        window.location.replace(gameUrl);
      } catch (error) {
        status.textContent = "Still trying to reach the game server";
        window.setTimeout(wakeGame, Math.min(2000 + attempt * 1000, 8000));
      }
    }
    wakeGame();
  </script>
</body>
</html>
