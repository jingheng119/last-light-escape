# Online multiplayer trial — original public single-player site remains on main.
# Five-player lobby runs from feature/five-player-lobby; the original game on main is unchanged.
services:
  - type: web
    runtime: node
    name: last-light-online-trial
    region: singapore
    plan: free
    branch: feature/five-player-lobby
    rootDir: multiplayer
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
