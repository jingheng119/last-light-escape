# Online multiplayer trial — original public single-player site remains on main.
# Reconnection-enabled five-player lobby runs from feature/player-reconnection; the original game on main is unchanged.
services:
  - type: web
    runtime: node
    name: last-light-online-trial
    region: singapore
    plan: free
    branch: feature/player-reconnection
    rootDir: multiplayer
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
