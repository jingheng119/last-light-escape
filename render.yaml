# Online multiplayer trial — original public single-player site remains on main.
# Import this Blueprint in Render using the feature/multiplayer-phase1 branch.
services:
  - type: web
    runtime: node
    name: last-light-online-trial
    region: singapore
    plan: free
    branch: feature/multiplayer-phase1
    rootDir: multiplayer
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: onCommit
